[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
noxvault = "8iDqwPFRxr2rHiuieVhGL4jdTT7XPE5qPAReS6VzTPw4"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
# Short epochs so the stake test can deactivate and collect within a minute.
slots_per_epoch = "64"
